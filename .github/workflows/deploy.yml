name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild daily so dagens ord's list of past answers moves on. 23:05 UTC is
  # 00:05 CET / 01:05 CEST, just after Swedish midnight in both, so the new
  # entry appears as soon as it stops being a spoiler.
  schedule:
    - cron: '5 23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        run: node --test tools/test.js
      - name: Build
        run: python3 tools/build.py
        env:
          BASE_PATH: ${{ vars.BASE_PATH }}
          BASE_URL: ${{ vars.BASE_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
